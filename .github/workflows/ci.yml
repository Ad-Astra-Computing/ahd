# Core CI: typecheck + tests + token validation on every push to main
# and every pull request.
#
# This is the required check on main: nothing merges, Dependabot
# included, without it passing. Dependabot's own PRs are proposals to
# review, never auto-merged (see AGENTS.md's Security section); this
# gate is what blocks a bad dep bump from landing regardless.
#
# Deliberately minimal. Heavier jobs (monthly roster eval, vision critique,
# release publish) live in their own workflows.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node (pinned)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.2"

      - name: Run release gate (install, build, typecheck, test, validate)
        # Composite action defined at .github/actions/gate. Single
        # source of truth so tag-release.yml and release.yml exercise
        # the same steps and a green tag-release implies a green
        # release. Edits to the gate live in one place.
        uses: ./.github/actions/gate

  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Secret scan
        run: nix develop .#guards --command gitleaks detect --no-banner --redact

      - name: Workflow lint
        run: nix develop .#guards --command zizmor --min-severity medium .github/workflows

      - name: Skill adapters up to date
        run: nix develop .#guards --command python3 tools/build-adapters.py --check

      # Skeleton guards (watermarks, paraphrase) run only via local git hooks.
